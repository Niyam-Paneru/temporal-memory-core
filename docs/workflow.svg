<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Temporal memory eligibility diagram</title><desc id="d">Known, valid, and allowed memories overlap; supersession and ranking happen only inside the eligible set.</desc>
<rect width="1200" height="520" fill="#f5f5f1"/>
<text x="58" y="64" fill="#71716a" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">TEMPORAL MEMORY</text>
<text x="58" y="108" fill="#171714" font-family="Georgia,serif" font-size="35">Relevant is useless if the memory is not eligible.</text>
<circle cx="440" cy="290" r="150" fill="#e4edb0" fill-opacity=".8" stroke="#596e35" stroke-width="2"/>
<circle cx="620" cy="290" r="150" fill="#dce9de" fill-opacity=".8" stroke="#4f7555" stroke-width="2"/>
<circle cx="530" cy="390" r="150" fill="#f1d9dc" fill-opacity=".8" stroke="#a4243b" stroke-width="2"/>
<text x="365" y="245" text-anchor="middle" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">known by then</text>
<text x="695" y="245" text-anchor="middle" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">valid then</text>
<text x="530" y="455" text-anchor="middle" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">allowed for this use</text>
<circle cx="530" cy="330" r="54" fill="#171714"/><text x="530" y="326" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="13" letter-spacing="1.5">ELIGIBLE</text><text x="530" y="347" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="12">then rank</text>
<rect x="875" y="208" width="255" height="138" rx="18" fill="#fff" stroke="#d8d8d1" stroke-width="2"/>
<text x="900" y="242" fill="#71716a" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">AFTER ELIGIBILITY</text><text x="900" y="276" fill="#171714" font-family="Arial,sans-serif" font-size="19" font-weight="700">supersede → score</text><text x="900" y="306" fill="#71716a" font-family="Arial,sans-serif" font-size="14">future knowledge cannot rewrite the past</text>
</svg>