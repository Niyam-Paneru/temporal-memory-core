<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">Temporal memory eligibility decision tree</title>
  <desc id="desc">A memory candidate must be known by the requested knowledge time, valid at the requested world time, allowed for the requested use, active, and not superseded by another eligible row before lexical relevance ranking. Failed gates are excluded before ranking; zero lexical overlap abstains after eligibility.</desc>

  <rect width="1200" height="1000" fill="#fbfbf8"/>

  <g font-family="Arial, sans-serif">
    <text x="64" y="58" font-size="13" letter-spacing="2.4" fill="#5b6470">TEMPORAL MEMORY CORE</text>
    <text x="64" y="96" font-size="30" font-weight="700" fill="#111827">Eligibility before relevance</text>
    <text x="64" y="126" font-size="15" fill="#4b5563">Every failed gate leaves the pipeline before ranking. Supersession is computed only from rows that already passed eligibility.</text>
  </g>

  <!-- Main decision spine -->
  <g font-family="Arial, sans-serif" fill="#111827" stroke="#1f2937" stroke-width="2">
    <rect x="92" y="168" width="330" height="62" rx="4" fill="#ffffff"/>
    <text x="118" y="194" font-size="12" fill="#6b7280" stroke="none">INPUT</text>
    <text x="118" y="216" font-size="18" font-weight="700" stroke="none">memory candidate</text>

    <rect x="92" y="274" width="330" height="70" rx="4" fill="#ffffff"/>
    <text x="118" y="300" font-size="12" fill="#6b7280" stroke="none">1 · known_by()</text>
    <text x="118" y="326" font-size="18" font-weight="700" stroke="none">learned_at ≤ known_at ?</text>

    <rect x="92" y="388" width="330" height="70" rx="4" fill="#ffffff"/>
    <text x="118" y="414" font-size="12" fill="#6b7280" stroke="none">2 · valid_at()</text>
    <text x="118" y="440" font-size="18" font-weight="700" stroke="none">valid at requested world time?</text>

    <rect x="92" y="502" width="330" height="70" rx="4" fill="#ffffff"/>
    <text x="118" y="528" font-size="12" fill="#6b7280" stroke="none">3 · eligible()</text>
    <text x="118" y="554" font-size="18" font-weight="700" stroke="none">required_use in allowed_use ?</text>

    <rect x="92" y="616" width="330" height="70" rx="4" fill="#ffffff"/>
    <text x="118" y="642" font-size="12" fill="#6b7280" stroke="none">4 · eligible()</text>
    <text x="118" y="668" font-size="18" font-weight="700" stroke="none">status == "active" ?</text>
  </g>

  <!-- Exclusion rail -->
  <g font-family="Arial, sans-serif">
    <rect x="670" y="248" width="430" height="462" rx="4" fill="#fff7f5" stroke="#c2413d" stroke-width="1.5"/>
    <text x="700" y="282" font-size="12" font-weight="700" letter-spacing="1.8" fill="#9f2f2b">EXCLUDED BEFORE RANKING</text>

    <g fill="#111827" font-size="15">
      <text x="700" y="326">Future knowledge</text>
      <text x="700" y="440">Not yet valid or already expired</text>
      <text x="700" y="554">Use not permitted</text>
      <text x="700" y="668">Retired / non-active record</text>
    </g>

    <g fill="#9f2f2b" font-size="12" font-weight="700">
      <text x="625" y="313">NO</text>
      <text x="625" y="427">NO</text>
      <text x="625" y="541">NO</text>
      <text x="625" y="655">NO</text>
    </g>
  </g>

  <!-- Connected arrows for eligibility gates -->
  <g fill="none" stroke="#1f2937" stroke-width="2">
    <path d="M257 230 V274"/>
    <path d="M257 344 V388"/>
    <path d="M257 458 V502"/>
    <path d="M257 572 V616"/>
    <path d="M422 309 H670"/>
    <path d="M422 423 H670"/>
    <path d="M422 537 H670"/>
    <path d="M422 651 H670"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#31634a">
    <text x="270" y="370">YES</text>
    <text x="270" y="484">YES</text>
    <text x="270" y="598">YES</text>
    <text x="270" y="712">YES</text>
  </g>

  <!-- List-level supersession and ranking -->
  <g font-family="Arial, sans-serif">
    <rect x="92" y="730" width="330" height="58" rx="4" fill="#eef6f1" stroke="#31634a" stroke-width="2"/>
    <text x="118" y="754" font-size="12" fill="#31634a">eligible_rows</text>
    <text x="118" y="776" font-size="17" font-weight="700" fill="#111827">candidate survived all row gates</text>

    <rect x="480" y="730" width="300" height="58" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="504" y="754" font-size="12" fill="#6b7280">5 · active_memories()</text>
    <text x="504" y="776" font-size="16" font-weight="700" fill="#111827">ID superseded by eligible row?</text>

    <rect x="842" y="730" width="258" height="58" rx="4" fill="#fff7f5" stroke="#c2413d" stroke-width="1.5"/>
    <text x="865" y="754" font-size="12" fill="#9f2f2b">YES → EXCLUDE</text>
    <text x="865" y="776" font-size="15" fill="#111827">superseded record</text>

    <rect x="480" y="832" width="300" height="58" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="504" y="856" font-size="12" fill="#6b7280">6 · retrieve()</text>
    <text x="504" y="878" font-size="16" font-weight="700" fill="#111827">lexical_score &gt; 0 ?</text>

    <rect x="842" y="812" width="258" height="58" rx="4" fill="#f4f4f2" stroke="#6b7280" stroke-width="1.5"/>
    <text x="865" y="836" font-size="12" fill="#6b7280">NO → ABSTAIN</text>
    <text x="865" y="858" font-size="15" fill="#111827">no relevant row</text>

    <rect x="92" y="832" width="330" height="58" rx="4" fill="#eef6f1" stroke="#31634a" stroke-width="2"/>
    <text x="118" y="856" font-size="12" fill="#31634a">YES → RANK</text>
    <text x="118" y="878" font-size="16" font-weight="700" fill="#111827">sort by score desc, id asc; take top_k</text>
    <rect x="92" y="918" width="330" height="54" rx="4" fill="#dfeee5" stroke="#31634a" stroke-width="2"/>
    <text x="118" y="940" font-size="12" fill="#31634a">RETURN</text>
    <text x="118" y="960" font-size="16" font-weight="700" fill="#111827">eligible top_k memories</text>
  </g>

  <g fill="none" stroke="#1f2937" stroke-width="2">
    <path d="M257 686 V730"/>
    <path d="M422 759 H480"/>
    <path d="M780 759 H842"/>
    <path d="M630 788 V832"/>
    <path d="M480 861 H422"/>
    <path d="M780 861 H842"/>
    <path d="M257 890 V918"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" font-weight="700">
    <text x="800" y="749" fill="#9f2f2b">YES</text>
    <text x="640" y="812" fill="#31634a">NO</text>
    <text x="438" y="851" fill="#31634a">YES</text>
    <text x="800" y="851" fill="#6b7280">NO</text>
  </g>
</svg>
