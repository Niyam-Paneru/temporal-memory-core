name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q src
      - name: Run behavior tests
        run: PYTHONPATH=src python -m unittest discover -s tests
      - name: Verify public documentation
        run: |
          test -s docs/workflow.svg
          test -s SECURITY.md
          test -s PROVENANCE.md
