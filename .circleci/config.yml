version: 2.1

jobs:
  verify:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Compile public source
          command: python -m compileall -q src
      - run:
          name: Run behavior tests
          command: PYTHONPATH=src python -m unittest discover -s tests
      - run:
          name: Verify public proof structure
          command: |
            test -s docs/workflow.svg
            test -s docs/overview.md
            test -s docs/decisions.md
            test -s docs/invariants.md
            test -s docs/failure-modes.md
            test -s SECURITY.md
            test -s PROVENANCE.md

workflows:
  public-proof:
    jobs:
      - verify
