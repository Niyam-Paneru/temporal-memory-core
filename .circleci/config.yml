version: 2.1

jobs:
  verify:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Compile public source
          command: python -m compileall -q src
      - run:
          name: Run behavior tests
          command: PYTHONPATH=src python -m unittest discover -s tests
      - run:
          name: Verify public workflow visual
          command: test -s docs/workflow.svg

workflows:
  public-proof:
    jobs:
      - verify
